spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/gridmind
    username: gridmind
    password: gridmind
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # Matches UploadedImageValidator's own cap — Spring rejects an oversized upload
      # before it ever reaches application code.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

gridmind:
  cors:
    allowed-origin: http://localhost:5173
  media:
    storage-path: ./data/media
  catalog:
    digikey:
      # Production by default — DigiKey ties an app's client ID to one specific
      # environment at creation time, and a Sandbox app's credentials are rejected here
      # with 401 "Invalid clientId" (confirmed directly against DigiKey's own API, not a
      # bug in this app). Production keyword search still costs nothing on the standard
      # free tier (1000 req/day) and returns real data instead of sandbox placeholders.
      # Override with DIGIKEY_BASE_URL=https://sandbox-api.digikey.com if your app was
      # created as a Sandbox app instead. See .env.example for how to get credentials.
      base-url: ${DIGIKEY_BASE_URL:https://api.digikey.com}
      client-id: ${DIGIKEY_CLIENT_ID:}
      client-secret: ${DIGIKEY_CLIENT_SECRET:}
    mouser:
      base-url: ${MOUSER_BASE_URL:https://api.mouser.com}
      api-key: ${MOUSER_API_KEY:}
    adafruit:
      # Public API, no credentials needed — on by default. Set ADAFRUIT_CATALOG_ENABLED=false
      # to skip fetching/caching Adafruit's ~8MB product feed if you don't want it.
      enabled: ${ADAFRUIT_CATALOG_ENABLED:true}
      base-url: ${ADAFRUIT_BASE_URL:https://www.adafruit.com}
    ebay:
      base-url: ${EBAY_BASE_URL:https://api.ebay.com}
      client-id: ${EBAY_CLIENT_ID:}
      client-secret: ${EBAY_CLIENT_SECRET:}
      # Which eBay marketplace to search — affects currency, language and which listings
      # show up. See .env.example for how to pick a different one.
      marketplace-id: ${EBAY_MARKETPLACE_ID:EBAY_US}
  imageanalysis:
    ollama:
      # "ollama" resolves via the Docker Compose network (see compose.yaml) — not
      # reachable like this outside of `docker compose up`.
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      model: ${OLLAMA_VISION_MODEL:qwen2.5vl:7b}
      # CPU inference on a multimodal model is slow by nature — generous on purpose, see
      # the README's "Local AI / Image analysis" section.
      timeout: ${OLLAMA_TIMEOUT:150s}

logging:
  level:
    org.gridmind: DEBUG
