spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/gridmind
    username: gridmind
    password: gridmind
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

gridmind:
  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    org.gridmind: DEBUG
