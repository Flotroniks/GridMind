services:
  postgres:
    image: 'postgres:17-alpine'
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: 'eclipse-temurin:21-jdk'
    working_dir: /app
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    volumes:
      - './backend:/app'
      - 'backend_gradle_cache:/root/.gradle'
      - 'backend_media:/app/data/media'
    command: sh gradlew bootRun --continuous
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    init: true

  ollama:
    image: 'ollama/ollama:latest'
    volumes:
      # Persisted so pulled models survive a restart instead of being re-downloaded —
      # qwen2.5vl:3b is ~3.2GB.
      - 'ollama_data:/root/.ollama'
    # No `ports:` — intentionally not published to the host. The backend reaches it over
    # the internal Compose network at http://ollama:11434 (see gridmind.imageanalysis.ollama.base-url
    # in application.yaml); nothing else needs to.
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true

  frontend:
    image: 'node:22-alpine'
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - './frontend:/app'
      - 'frontend_node_modules:/app/node_modules'
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '5173:5173'
    init: true

volumes:
  postgres_data:
  backend_gradle_cache:
  backend_media:
  frontend_node_modules:
  ollama_data:
