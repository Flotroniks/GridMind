services:
  postgres:
    image: 'postgres:17-alpine'
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: 'eclipse-temurin:21-jdk'
    working_dir: /app
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    volumes:
      - './backend:/app'
      - 'backend_gradle_cache:/root/.gradle'
      - 'backend_media:/app/data/media'
    command: sh gradlew bootRun --continuous
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    init: true

  mosquitto:
    image: 'eclipse-mosquitto:2'
    volumes:
      - './mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro'
    # Published to the host (unlike ollama) so the broker can be inspected directly from
    # outside Docker during development — e.g. `mosquitto_sub -h localhost -t
    # gridmind/locate` to watch locate highlights as you type, with no GUI client needed.
    ports:
      - '1883:1883'
    healthcheck:
      # A plain publish (not a subscribe-and-wait): success just means the broker
      # accepted the TCP connection and the MQTT CONNECT handshake, which is all this
      # needs to prove — a subscribe-based check tried first turned out to depend on
      # $SYS topic timing that wasn't reliably immediate.
      test: ['CMD-SHELL', 'mosquitto_pub -h localhost -t healthcheck -m ping -i healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

  ollama:
    image: 'ollama/ollama:latest'
    volumes:
      # Persisted so pulled models survive a restart instead of being re-downloaded —
      # qwen2.5vl:7b is ~6GB.
      - 'ollama_data:/root/.ollama'
    # No `ports:` — intentionally not published to the host. The backend reaches it over
    # the internal Compose network at http://ollama:11434 (see gridmind.imageanalysis.ollama.base-url
    # in application.yaml); nothing else needs to.
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true

  frontend:
    image: 'node:22-alpine'
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - './frontend:/app'
      - 'frontend_node_modules:/app/node_modules'
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '5173:5173'
    init: true

volumes:
  postgres_data:
  backend_gradle_cache:
  backend_media:
  frontend_node_modules:
  ollama_data:
